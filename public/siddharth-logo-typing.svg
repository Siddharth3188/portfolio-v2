<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Siddharth logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .t { opacity: 0; animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: step-end; }
    .b1 { animation-name: showL; }
    .s  { animation-name: showS; }
    .b2 { animation-name: showR; }
    .cur { animation: move 6s infinite step-end; }
    .cur rect { animation: blink 6s infinite step-end; }

    @keyframes showL { 0% {opacity:0} 10% {opacity:1} 93% {opacity:0} 100% {opacity:0} }
    @keyframes showS { 0% {opacity:0} 23% {opacity:1} 93% {opacity:0} 100% {opacity:0} }
    @keyframes showR { 0% {opacity:0} 37% {opacity:1} 93% {opacity:0} 100% {opacity:0} }

    @keyframes move {
      0%  { transform: translateX(0); }
      10% { transform: translateX(47px); }
      23% { transform: translateX(118px); }
      37% { transform: translateX(160px); }
      93% { transform: translateX(0); }
    }
    @keyframes blink {
      0%,36.99% { opacity: 1; }
      43% {opacity:0} 49% {opacity:1} 55% {opacity:0} 61% {opacity:1}
      67% {opacity:0} 73% {opacity:1} 79% {opacity:0} 85% {opacity:1}
      91% {opacity:0} 93% {opacity:1} 100% {opacity:1}
    }

    @media (prefers-reduced-motion: reduce) {
      .t { animation: none; opacity: 1; }
      .cur { display: none; }
    }
  </style>

  <rect width="200" height="200" rx="44" fill="#141412"/>
  <rect x="2" y="2" width="196" height="196" rx="42" fill="none" stroke="#f3efe6" stroke-opacity="0.18" stroke-width="2"/>

  <path class="t b1" d="M58 70 L30 100 L58 130" fill="none" stroke="#e5694f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t s" x="100" y="134" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#f3efe6">S</text>
  <path class="t b2" d="M142 70 L170 100 L142 130" fill="none" stroke="#e5694f" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

  <g class="cur"><rect x="16" y="62" width="5" height="76" rx="2" fill="#e5694f"/></g>
</svg>
